# javmem's graph store (backend C, and the graph half of backend A): the official Graphiti MCP server and Neo4j, two
# containers from their makers' own images. Nothing of anyone's memory is in them: the graph starts empty and fills from
# what javmem-feed (or the DSH plugin) sends in.
#   cp .env.example .env    # then choose the models and set NEO4J_PASSWORD in .env
#   docker compose up -d
# The MCP endpoint is http://127.0.0.1:${GRAPHITI_PORT:-8000}/mcp/ ; only this computer can reach it.
# To look at the graph: http://127.0.0.1:${NEO4J_HTTP_PORT:-17474} (connect to bolt://127.0.0.1:${NEO4J_BOLT_PORT:-17687}).
# One container instead of two, without Neo4j: docker-compose.falkordb.yml.
name: javmem-graphiti

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    environment:
      # Used when the database is first created; changing it later needs the change made inside Neo4j as well.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env, at least 8 characters}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      # Not Neo4j's usual 7474 and 7687, so that a Neo4j already on this computer is left alone.
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  graphiti:
    image: zepai/knowledge-graph-mcp:${GRAPHITI_IMAGE_TAG:-1.1.3-standalone}
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # The server always reads config/config.yaml (its --config default wins over CONFIG_PATH), so ours goes there.
      CONFIG_PATH: /app/mcp/config/config.yaml
      GRAPHITI_DB: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env, at least 8 characters}
      NEO4J_DATABASE: neo4j
      SEMAPHORE_LIMIT: ${SEMAPHORE_LIMIT:-2}
      GRAPHITI_TELEMETRY_ENABLED: "false"
    volumes:
      - ./config.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:${GRAPHITI_PORT:-8000}:8000"
    # Lets the container reach models on this computer (Ollama, a local embedding service) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  neo4j_data:
  neo4j_logs:
