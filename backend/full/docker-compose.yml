# javmem's full set (backend A) in one compose: the fact store (memv2-lite) and the graph (the official Graphiti MCP
# server and Neo4j), with the same models from one .env. Optionally the models too, on this computer (Ollama).
# Both stores start empty.
#   cp .env.example .env              # choose the models and set NEO4J_PASSWORD
#   docker compose up -d --build      # cloud models
#   docker compose --profile local up -d --build    # models on this computer (Ollama; pulls them the first time)
# Endpoints, on this computer only: facts http://127.0.0.1:${MEMV2_PORT:-8766}, graph http://127.0.0.1:${GRAPHITI_PORT:-8000}/mcp/
# To look at the graph: http://127.0.0.1:${NEO4J_HTTP_PORT:-17474} (connect to bolt://127.0.0.1:${NEO4J_BOLT_PORT:-17687}).
# One container for the graph instead of two, without Neo4j: docker-compose.falkordb.yml.
name: javmem

services:
  memv2:
    build:
      context: ../..
      dockerfile: backend/memv2/Dockerfile
    image: javmem-memv2-lite:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - memv2_data:/data
    ports:
      - "127.0.0.1:${MEMV2_PORT:-8766}:8766"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    environment:
      # Used when the database is first created; changing it later needs the change made inside Neo4j as well.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env, at least 8 characters}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      # Not Neo4j's usual 7474 and 7687, so that a Neo4j already on this computer is left alone.
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  graphiti:
    image: zepai/knowledge-graph-mcp:${GRAPHITI_IMAGE_TAG:-1.1.3-standalone}
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # The server always reads config/config.yaml (its --config default wins over CONFIG_PATH), so ours goes there.
      CONFIG_PATH: /app/mcp/config/config.yaml
      GRAPHITI_DB: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env, at least 8 characters}
      NEO4J_DATABASE: neo4j
      SEMAPHORE_LIMIT: ${SEMAPHORE_LIMIT:-2}
      GRAPHITI_TELEMETRY_ENABLED: "false"
    volumes:
      - ../graphiti/config.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:${GRAPHITI_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Models on this computer: only with --profile local. In .env, point both stores at http://ollama:11434/v1.
  ollama:
    profiles: ["local"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # With an NVIDIA card and its container toolkit, uncomment to use it:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    profiles: ["local"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${MODEL_NAME:-qwen3:14b} && ollama pull ${EMBEDDER_MODEL:-qwen3-embedding:0.6b}"]
    restart: "no"

volumes:
  memv2_data:
  neo4j_data:
  neo4j_logs:
  ollama_models:
